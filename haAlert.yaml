alias: MVHR Smart Boost Trigger
description: >-
  Triggers MVHR boost based on humidity spikes or poor air quality, with
  re-evaluation and notifications.
trigger_variables:
  HUMIDITY_ALERT: 4
  SCORE_ALERT: 10
  CO2_ALERT: 1200
triggers:
  - trigger: template
    id: kitchen_humidity
    value_template: "{{ states('sensor.kitchenhumiditychange') | float(0) > HUMIDITY_ALERT }}"
  - trigger: template
    id: ensuite_humidity
    value_template: "{{ states('sensor.ensuitebathroomhumiditychange') | float(0) > HUMIDITY_ALERT }}"
  - trigger: template
    id: family_humidity
    value_template: "{{ states('sensor.familybathroomhumiditychange') | float(0) > HUMIDITY_ALERT }}"
  - trigger: template
    id: poor_air_score
    value_template: "{{ states('sensor.awair_element_59410_score') | float(100) < SCORE_ALERT }}"
  - trigger: template
    id: living_co2
    value_template: "{{ states('sensor.i_9psl_carbon_dioxide') | float(0) > CO2_ALERT }}"
  - trigger: template
    id: kitchen_co2
    value_template: "{{ states('sensor.awair_element_59410_carbon_dioxide') | float(0) > CO2_ALERT }}"
conditions: []
actions:
  - target:
      entity_id: switch.loft_mvhr_monitor_boost
    action: switch.turn_on
  - data:
      title: MVHR Boost On
      message: >-
        {%- set t = now().strftime('%H:%M') -%}
        {%- set alerts = {
          'kitchen_humidity': ('Kitchen Humidity', 'sensor.kitchenhumiditychange', '>', HUMIDITY_ALERT, '%/min'),
          'ensuite_humidity': ('Ensuite Humidity', 'sensor.ensuitebathroomhumiditychange', '>', HUMIDITY_ALERT, '%/min'),
          'family_humidity': ('Family Bathroom Humidity', 'sensor.familybathroomhumiditychange', '>', HUMIDITY_ALERT, '%/min'),
          'poor_air_score': ('Kitchen Air Score', 'sensor.awair_element_59410_score', '<', SCORE_ALERT, ''),
          'living_co2': ('Living Room CO2', 'sensor.i_9psl_carbon_dioxide', '>', CO2_ALERT, 'ppm'),
          'kitchen_co2': ('Kitchen CO2', 'sensor.awair_element_59410_carbon_dioxide', '>', CO2_ALERT, 'ppm')
        } -%}
        {%- set item = alerts.get(trigger.id) if trigger is defined else none -%}
        {%- if item -%}
          {%- set unit = state_attr(item[1], 'unit_of_measurement') or item[4] -%}
          {%- set val = states(item[1]) ~ (' ' ~ unit if unit else '') -%}
          Boost On {{ t }}: {{ item[0] }}: {{ val }} {{ item[2] }} {{ item[3] }}
        {%- else -%}
          Boost On {{ t }}: Manual trigger
        {%- endif -%}
    action: notify.persistent_notification
  - delay: '00:15:00'
  - repeat:
      while:
        - condition: template
          value_template: |-
            {{ states('sensor.i_9psl_carbon_dioxide') | float(0) > CO2_ALERT or
               states('sensor.awair_element_59410_carbon_dioxide') | float(0) > CO2_ALERT or
               states('sensor.awair_element_59410_score') | float(100) < SCORE_ALERT or
               states('sensor.kitchenhumiditychange') | float(0) > HUMIDITY_ALERT or
               states('sensor.ensuitebathroomhumiditychange') | float(0) > HUMIDITY_ALERT or
               states('sensor.familybathroomhumiditychange') | float(0) > HUMIDITY_ALERT }}
      sequence:
        - delay: '00:05:00'
        - data:
            title: MVHR Boost Extended
            message: Levels still elevated (+5 mins).
          action: notify.persistent_notification
  - target:
      entity_id: switch.loft_mvhr_monitor_boost
    action: switch.turn_off
  - data:
      title: MVHR Boost Off
      message: Levels back to normal.
    action: notify.persistent_notification
mode: single
max_exceeded: silent
